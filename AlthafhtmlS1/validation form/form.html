<!DOCTYPE html>
<html>
<head>
	<title> Form</title>
<style>
	body {
  	 	font-family: Arial, Helvetica, sans-serif;
    		background-color: #f5f7fa;
  		margin: 0;
   		padding: 0;
	
}
	h1{text-align:center;
}

	form {
	
    		width: 400px;
    		margin: 40px auto;
    		background-color: lightblue;
    		padding: 25px 35px;
    		border-radius: 90px;
}
</style>	
<script>
function validateForm() {
    let username = document.getElementById("name").value;
    let password = document.getElementById("pwd").value;
    let rePassword = document.getElementById("repwd").value;
    let phone = document.getElementById("mobile").value;

    if (username === "") {
        alert("Please enter your name");
        return false;
    } else if (!isNaN(username)) {
        alert('Name requires alphabets!');
        return false;
    }

    if (password === "") {
        alert("Please enter your password");
        return false;
    }

    if (password.length < 8) {
        alert("Password must be at least 8 characters long");
        return false;
    }

    if (rePassword === "") {
        alert("Retype your password");
        return false;
    }

    if (rePassword !== password) { 
        alert("Passwords do not match");
        return false;
    }

    if (phone === "") {
        alert("Please enter your phone number");
        return false;
    } else if (isNaN(phone)) {
        alert('Invalid phone number');
        return false;
    }

    if (phone.length != 10) {
        alert("Not a valid phone number (need 10 digits)");
        return false;
    }
    alert("Submitted Successfully"); 
    return true; 
}
	</script>
</head>
<body>

	<form name="regForm" onsubmit="return validateForm()">
	<table>
		<center>
		<h1><em> Validation Form</em></h1>
		</center>
		<tr>
			<td><label><b>Name</b></label></td>
			<td><input type="text" name="first_name" id="name" ></td>
		</tr>
		<tr>
			<td><label>Password</label></td>
			<td><input type="password" name="pass" id="pwd" ></td>
		</tr>
		<tr>
			<td><label>Retype Password</label></td>
			<td><input type="password" name="pass" id="repwd" ></td>
		</tr>
		<tr>
			<td><label>Mobile Number</label></td>
			<td><input type="text" name="num" maxlength="10"id="mobile"/></td>
		</tr>
		
		<tr>
			<td></td>
			<td>
				<input type="submit" name="submit" class="sub" value="Submit"/>
				<input type="reset" name="cancel" value="Cancel" class="sub2"/>
			</td>
		</tr>
	</table>
	</form>

</body>
</html>
